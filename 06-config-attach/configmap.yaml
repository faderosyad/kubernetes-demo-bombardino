apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    http {
      server {
        listen 80;
        server_name _;
        location / {
          proxy_pass http://nginx;
        }
      }
    }
  APP_PORT: "80"
  APP_ENDPOINT: "/api"
  .env: |
    COlOR=BLUE
    ENV=DEVELOPMENT
    LOG_LEVEL=INFO
